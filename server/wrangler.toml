name = "neon-arena-leaderboard"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Comma-separated origins allowed to call the API. Local hosts are always allowed.
ALLOWED_ORIGINS = "https://mmmax21.github.io"
SEASON = "1"

[[d1_databases]]
binding = "DB"
database_name = "neon-arena"
# Replace with the id printed by `npx wrangler d1 create neon-arena`.
database_id = "6f384648-541e-4bb5-b7ea-3bbad1ed9a73"

# Online co-op rooms: one SQLite-backed Durable Object per room (available on the free plan).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
